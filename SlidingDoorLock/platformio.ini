; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; battery powered: Arduino is built as an ESP-IDF component so power management (automatic
; light sleep) can be turned on - the prebuilt Arduino core has it off. Settings are in
; sdkconfig.defaults; components/esp_littlefs provides LittleFS, which the prebuilt core bundles.
; The first build compiles ESP-IDF and takes several minutes.
[env:firebeetle32]
platform = espressif32@5.2.0
board = firebeetle32
framework = arduino, espidf
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
; replaces editing ElegantOTA.h by hand to switch it to the async web server
build_flags =
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
lib_deps =
    esp32async/ESPAsyncWebServer
    esp32async/AsyncTCP
    ayushsharma82/ElegantOTA
    fbiego/ESP32Time
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
